; ============================================================
; UNIUBE CAFE WiFi — projeto INDEPENDENTE (criado 26/jul, virada LoRa -> WiFi)
; Estacao WiFi do campus Uniube (cafe). Sensor 7x1 LOTE VELHO, slave 1.
; Copia IDENTICA da laranja_wifi (mesma logica e sequencia), mudando so:
; identidade (UNIUBE_WIFI_CAFE), rede (AiAgro) e caminhos de OTA (cafe_wifi/).
; OTA proprio: cafe_wifi/VERSION + cafe_wifi/builds/UNIUBE_WIFI_CAFE.bin
;
; Compilar: pio run -e UNIUBE_WIFI_CAFE
; Flashar:  pio run -e UNIUBE_WIFI_CAFE -t upload --upload-port /dev/cu.usbserial-XX
; Atualizar OTA: copiar .bin pra builds/UNIUBE_WIFI_CAFE.bin e subir VERSION (c1 -> c2 -> ...)
; ============================================================

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.10
    bblanchon/ArduinoJson@^7.0.0

; ---------- UNIUBE CAFE WiFi (campus Uniube, rede nova AiAgro) ----------
[env:UNIUBE_WIFI_CAFE]
build_flags =
  -DDEVICE_CODIGO=\"UNIUBE_WIFI_CAFE\"
  -DDISP_ID=\"92c33471-df32-487e-a895-f044fa280def\"
  '-DWIFI_SSID="AiAgro"'
  '-DWIFI_PASS="f9nBb62Kf9fk"'

; ---------- CAFE — TESTE BANCADA (AP 101) ----------
[env:UNIUBE_WIFI_CAFE_BANCADA]
build_flags =
  -DDEVICE_CODIGO=\"UNIUBE_WIFI_CAFE\"
  -DDISP_ID=\"92c33471-df32-487e-a895-f044fa280def\"
  '-DWIFI_SSID="AP 101"'
  '-DWIFI_PASS="Barbosan"'
