; ============================================================
; ESTACAO CLIENTE WiFi — firmware UNICO pro lote de pre-venda
; Sensor 7x1 LOTE VELHO. Base: laranja_wifi l3.
;
; Nao tem mais SSID/senha no build: quem configura a internet e o
; produtor, pelo celular (captive portal — ver src/provisao.cpp).
; O mesmo .bin serve pra qualquer cliente.
;
; Compilar teste:  pio run -e ESTACAO_CLIENTE_TESTE
; Flashar:         pio run -e ESTACAO_CLIENTE_TESTE -t upload --upload-port /dev/cu.usbserial-XX
; Monitor:         pio device monitor -b 115200
; OTA: copiar .bin pra builds/ESTACAO_CLIENTE.bin e subir VERSION (e1 -> e2 -> ...)
; ============================================================

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; O portal HTML + WebServer + DNSServer somam ~90KB. Na tabela de particao
; padrao (1,2MB por slot OTA) isso ficaria em 80% de ocupacao — apertado pro
; que ainda vem. min_spiffs da 1,9MB por slot e mantem os 2 slots de OTA.
; ATENCAO: tabela de particao NAO muda por OTA. Placa que ja rodou o
; firmware antigo precisa de UM flash por USB pra migrar (o do lote novo
; ja sai de fabrica assim).
board_build.partitions = min_spiffs.csv
; Sem libs de OLED desde o e3: nenhuma placa do lote tem display.
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.0

; ---------- PRODUCAO (lote) ----------
; Sem DISP_ID: o UUID entra na bancada, um por unidade, pelo serial
;   (abre o monitor e manda:  id=<uuid-da-etiqueta>  )
; Envia 3 pacotes as 07:30 BR e dorme ate o dia seguinte.
[env:ESTACAO_CLIENTE]
build_flags =
  -DDEVICE_CODIGO=\"ESTACAO_CLIENTE\"

; ---------- BANCADA DO LOTE ----------
; Igual ao de producao (sem DISP_ID: identidade vem da NVS gravada placa a
; placa), mas com o ciclo curto do MODO_TESTE pra a leitura chegar no
; Supabase em minutos em vez de esperar as 07:30. E o que roda no burn-in.
[env:ESTACAO_CLIENTE_BANCADA]
build_flags =
  -DDEVICE_CODIGO=\"ESTACAO_CLIENTE\"
  -DMODO_TESTE

; ---------- TESTE DE CAMPO / BANCADA ----------
; 10 leituras a cada 15s, dorme 10 min e repete — da pra ver chegando
; no Supabase sem esperar as 07:30. Manda pro dispositivo TESTE_PROVISAO_01
; (criado no Supabase Hardware em 15/ago, fazenda Uniube) pra nao sujar
; os dados de nenhuma estacao de producao.
[env:ESTACAO_CLIENTE_TESTE]
build_flags =
  -DDEVICE_CODIGO=\"ESTACAO_CLIENTE\"
  -DDISP_ID=\"d15c0a11-7e57-4a1b-9c2e-000000000001\"
  -DMODO_TESTE
