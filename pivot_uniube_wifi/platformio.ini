; ============================================================
; UNIUBE PIVOT WiFi — projeto INDEPENDENTE (criado 26/jul, virada LoRa -> WiFi)
; Estacao do pivo central da Uniube. 2x sensor 7x1 LOTE NOVO (slave 1 + 2).
; Alimentada pela ENERGIA do pivo (sem restricao de consumo).
; Internet via HOTSPOT de celular do lado da placa (AiAgroCelular) —
; envia de 10 em 10 minutos pra manter o hotspot acordado.
; Fallback de rede: AiAgro (campus), se o hotspot sumir.
; OTA proprio: pivot_uniube_wifi/VERSION + pivot_uniube_wifi/builds/UNIUBE_WIFI_PIVOT.bin
;
; Compilar: pio run -e UNIUBE_WIFI_PIVOT
; Flashar:  pio run -e UNIUBE_WIFI_PIVOT -t upload --upload-port /dev/cu.usbserial-XX
; Atualizar OTA: copiar .bin pra builds/UNIUBE_WIFI_PIVOT.bin e subir VERSION (p1 -> p2 -> ...)
; ============================================================

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.10
    bblanchon/ArduinoJson@^7.0.0

; ---------- UNIUBE PIVOT WiFi (hotspot celular ao lado da placa) ----------
[env:UNIUBE_WIFI_PIVOT]
build_flags =
  -DDEVICE_CODIGO=\"UNIUBE_WIFI_PIVOT\"
  -DDISP_ID=\"19ac767a-1c2a-4257-a7fa-0afdea4b9b27\"
  '-DWIFI_SSID="AiAgroCelular"'
  '-DWIFI_PASS="20132013"'
  '-DWIFI_SSID_FB="AiAgro"'
  '-DWIFI_PASS_FB="f9nBb62Kf9fk"'

; ---------- PIVOT — TESTE BANCADA (AP 101) ----------
[env:UNIUBE_WIFI_PIVOT_BANCADA]
build_flags =
  -DDEVICE_CODIGO=\"UNIUBE_WIFI_PIVOT\"
  -DDISP_ID=\"19ac767a-1c2a-4257-a7fa-0afdea4b9b27\"
  '-DWIFI_SSID="AP 101"'
  '-DWIFI_PASS="Barbosan"'
